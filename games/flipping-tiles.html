<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flipping Tiles</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080808;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:16px}#app{width:min(100%,650px);text-align:center}h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:.12em;margin:0 0 12px}.sub{color:#aaa;margin:0 0 32px}.modes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}button{cursor:pointer;font:inherit}.mode,.action{background:#111;color:#fff;border:1px solid #eee;padding:13px 24px;min-width:145px}.mode:hover,.action:hover{background:#fff;color:#000}#game{display:none}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 auto 16px;max-width:560px}.top button{background:none;color:#fff;border:1px solid #777;padding:8px 11px}.top button:hover{background:#fff;color:#000}.mode-label{font-size:.8rem;color:#bbb;letter-spacing:.1em}#timer{font-variant-numeric:tabular-nums;font-size:1.1rem}#board{display:grid;width:min(86vw,540px);aspect-ratio:1;margin:auto;gap:6px;padding:7px;background:#111;border:1px solid #444}.tile{padding:0;min-width:0;min-height:0;background:#050505;border:2px solid #fff}.tile.white{background:#f5f5f5;border-color:#050505}.hint{color:#999;font-size:.82rem;margin-top:16px}#overlay{display:none;position:fixed;inset:0;background:#000d;z-index:3;align-items:center;justify-content:center;padding:16px}.card{position:relative;background:#101010;border:1px solid #777;padding:28px 22px 22px;width:min(100%,410px);max-height:90vh;overflow:auto}.card h2{letter-spacing:.12em;margin:4px 0 18px}.close{position:absolute;right:10px;top:8px;background:none;border:0;color:#fff;font-size:28px;min-width:0;padding:2px 8px}.time{font-size:2.2rem;font-weight:bold;font-variant-numeric:tabular-nums}.rank-title{border-top:1px solid #444;padding-top:14px;margin:18px 0 8px;font-size:.85rem;letter-spacing:.1em}ol{padding:0;margin:0 0 18px;list-style:none;text-align:left}li{display:flex;justify-content:space-between;border-bottom:1px solid #292929;padding:7px 2px;font-size:.9rem}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.empty{justify-content:center;color:#888}@media(max-width:480px){#board{width:92vw;gap:4px;padding:5px}.top{font-size:.85rem}.card{padding:27px 16px 18px}}
</style></head><body><main id="app">
<section id="menu"><h1>FLIPPING TILES</h1><p class="sub">Flip the tiles until every tile is black.</p><div class="modes"><button class="mode" id="easy">EASY MODE</button><button class="mode" id="hard">HARD MODE</button></div></section>
<section id="game"><div class="top"><button id="back">← HOME</button><span class="mode-label" id="label"></span><span id="timer">00:00.0</span></div><div id="board"></div><p class="hint">Click a tile to flip it and its adjacent tiles.</p></section></main>
<div id="overlay"><section class="card"><button class="close" id="close" aria-label="Close">×</button><h2>COMPLETED</h2><div class="time" id="finalTime">00:00.0</div><div class="rank-title" id="rankTitle"></div><ol id="ranks"></ol><div class="actions"><button class="action" id="again">PLAY AGAIN</button><button class="action" id="home">MAIN MENU</button></div></section></div>
<script>
(()=>{const $=id=>document.getElementById(id);let size=5,mode='easy',cells=[],moves=0,startAt=0,elapsed=0,running=false,tick;
const fmt=ms=>{let n=Math.floor(ms/100),m=Math.floor(n/600),s=Math.floor(n/10)%60,d=n%10;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d};
function flip(a,i){let r=Math.floor(i/size),c=i%size;[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([y,x])=>{if(y>=0&&y<size&&x>=0&&x<size)a[y*size+x]=!a[y*size+x]})}
function puzzle(){let a=Array(size*size).fill(false),prev=-1,steps=mode==='easy'?24:75;for(let k=0;k<steps;k++){let i;do{i=Math.floor(Math.random()*a.length)}while(i===prev);prev=i;flip(a,i)}if(a.filter(Boolean).length<(mode==='easy'?7:18))for(let k=0;k<(mode==='easy'?10:25);k++)flip(a,Math.floor(Math.random()*a.length));return a}
function render(){let b=$('board');b.innerHTML='';b.style.gridTemplateColumns=`repeat(${size},1fr)`;b.style.gridTemplateRows=`repeat(${size},1fr)`;cells.forEach((v,i)=>{let e=document.createElement('button');e.className='tile'+(v?' white':'');e.setAttribute('aria-label',`${v?'white':'black'} tile`);e.onclick=()=>move(i);b.append(e)})}
function reset(){clearInterval(tick);running=false;elapsed=0;moves=0;$('timer').textContent='00:00.0';cells=puzzle();render()}
function begin(m){mode=m;size=m==='easy'?5:8;$('menu').style.display='none';$('game').style.display='block';$('overlay').style.display='none';$('label').textContent=`${m.toUpperCase()} MODE · ${size}×${size}`;reset()}
function move(i){if(!running&&moves===0){running=true;startAt=performance.now();tick=setInterval(()=>$('timer').textContent=fmt(performance.now()-startAt),100)}flip(cells,i);moves++;[...$('board').children].forEach((e,j)=>e.classList.toggle('white',cells[j]));if(cells.every(v=>!v))finish()}
function records(){try{return JSON.parse(localStorage.getItem('flippingTiles_'+mode)||'[]')}catch{return[]}}
function finish(){elapsed=performance.now()-startAt;running=false;clearInterval(tick);$('timer').textContent=fmt(elapsed);$('finalTime').textContent=fmt(elapsed);let a=records();a.push({time:elapsed,moves});a.sort((x,y)=>x.time-y.time||x.moves-y.moves);a=a.slice(0,10);localStorage.setItem('flippingTiles_'+mode,JSON.stringify(a));$('rankTitle').textContent=mode.toUpperCase()+' MODE · TOP 10';$('ranks').innerHTML='';a.forEach((v,i)=>{let li=document.createElement('li'),l=document.createElement('span'),r=document.createElement('span');l.textContent=`${i+1}. ${fmt(v.time)}`;r.textContent=`${v.moves} moves`;li.append(l,r);$('ranks').append(li)});$('overlay').style.display='flex'}
function home(){clearInterval(tick);running=false;$('overlay').style.display='none';$('game').style.display='none';$('menu').style.display='block'}
$('easy').onclick=()=>begin('easy');$('hard').onclick=()=>begin('hard');$('back').onclick=home;$('home').onclick=home;$('close').onclick=home;$('again').onclick=()=>begin(mode);
})();
</script></body></html>
