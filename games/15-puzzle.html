<div id="puzzle15-game">
<style>
#puzzle15-game{color:#f4f4f4;font-family:inherit;width:100%;max-width:900px;margin:auto}#puzzle15-game *{box-sizing:border-box}#puzzle15-game .hide{display:none!important}#puzzle15-game .title{font-size:clamp(26px,4vw,38px);font-weight:800;margin:6px 0 8px}#puzzle15-game .sub{color:#aaa;margin:0 0 24px;font-size:14px}#puzzle15-game .modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}#puzzle15-game .mode{border:1px solid #393939;background:#191919;color:#fff;border-radius:15px;padding:18px 16px;text-align:left;cursor:pointer}#puzzle15-game .mode:hover{border-color:#aaa}#puzzle15-game .mode h3{font-size:21px;margin:0 0 8px}#puzzle15-game .best{font-size:13px;color:#ccc;line-height:1.7}#puzzle15-game .tag{display:inline-block;border:1px solid #444;border-radius:99px;padding:3px 8px;font-size:10px;color:#aaa;margin-bottom:12px}#puzzle15-game .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}#puzzle15-game .size-label{font-size:20px;font-weight:750}#puzzle15-game .stats{display:flex;gap:10px}#puzzle15-game .stat{border:1px solid #383838;background:#191919;border-radius:10px;padding:9px 14px;min-width:100px}#puzzle15-game .stat small{display:block;font-size:10px;letter-spacing:.12em;color:#999;margin-bottom:3px}#puzzle15-game .stat strong{font-size:19px;font-variant-numeric:tabular-nums}#puzzle15-game .board-wrap{width:min(100%,590px);margin:auto}#puzzle15-game .board{display:grid;gap:7px;width:100%;aspect-ratio:1;padding:8px;border:1px solid #393939;border-radius:16px;background:#101010;touch-action:manipulation}#puzzle15-game .tile{border:1px solid #4b4b4b;border-radius:9px;background:#292929;color:#fff;font-size:clamp(15px,3.3vw,27px);font-weight:750;cursor:pointer;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;user-select:none}#puzzle15-game .tile:hover:not(.empty){background:#393939;border-color:#888}#puzzle15-game .tile.empty{background:#171717;border:1px dashed #2d2d2d;cursor:default}#puzzle15-game .help{text-align:center;color:#888;font-size:12px;margin:13px 0 0}#puzzle15-game .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 0}#puzzle15-game .btn{border:1px solid #484848;background:#222;color:#f6f6f6;border-radius:10px;padding:11px 16px;font-weight:650;cursor:pointer}#puzzle15-game .btn:hover{background:#303030;border-color:#777}#puzzle15-game .primary{background:#f2f2f2;color:#111;border-color:#f2f2f2}#puzzle15-game .overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:99999}#puzzle15-game .result{position:relative;width:min(100%,430px);background:#181818;border:1px solid #484848;border-radius:18px;padding:30px 24px 25px;text-align:center;box-shadow:0 20px 80px #0009}#puzzle15-game .close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#aaa;font-size:25px;cursor:pointer}#puzzle15-game .eyebrow{font-size:11px;letter-spacing:.17em;color:#aaa}#puzzle15-game .result h2{font-size:29px;margin:8px 0 4px}#puzzle15-game .grade{font-size:58px;font-weight:900;margin:12px 0 2px}#puzzle15-game .score{color:#ddd;font-size:16px;margin-bottom:20px}#puzzle15-game .result-stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:22px}#puzzle15-game .result-stat{border:1px solid #383838;border-radius:10px;padding:11px}#puzzle15-game .result-stat small{display:block;color:#999;font-size:10px;letter-spacing:.1em;margin-bottom:5px}#puzzle15-game .result-stat strong{font-size:18px}#puzzle15-game .result-actions{display:grid;gap:9px}#puzzle15-game .result-actions .btn{width:100%}@media(max-width:620px){#puzzle15-game .modes{grid-template-columns:1fr;gap:10px}#puzzle15-game .mode{padding:15px}#puzzle15-game .board{gap:5px;padding:6px;border-radius:12px}#puzzle15-game .tile{border-radius:6px}#puzzle15-game .stat{min-width:82px;padding:8px 10px}#puzzle15-game .stat strong{font-size:17px}#puzzle15-game .result{padding:28px 18px 20px}}
</style>
<section id="menu"><div class="title">15 Puzzle</div><p class="sub">Choose a board size and slide the tiles into order. The empty space belongs at the bottom-right.</p><div class="modes">
<button class="mode" data-size="4"><span class="tag">CLASSIC</span><h3>4 × 4</h3><div class="best" id="best4">Loading…</div></button>
<button class="mode" data-size="5"><span class="tag">ADVANCED</span><h3>5 × 5</h3><div class="best" id="best5">Loading…</div></button>
<button class="mode" data-size="6"><span class="tag">EXPERT</span><h3>6 × 6</h3><div class="best" id="best6">Loading…</div></button>
</div></section>
<section id="play" class="hide"><div class="top"><div class="size-label" id="sizeLabel">4 × 4</div><div class="stats"><div class="stat"><small>MOVE</small><strong id="moves">0</strong></div><div class="stat"><small>TIME</small><strong id="time">00:00</strong></div></div></div><div class="board-wrap"><div class="board" id="board"></div></div><p class="help">Tap or click a tile next to the empty space to move it.</p><div class="actions"><button class="btn" id="restart">Restart</button><button class="btn" id="home">Main menu</button></div></section>
<div class="overlay hide" id="overlay" role="dialog" aria-modal="true"><div class="result"><button class="close" id="close" aria-label="Close">×</button><div class="eyebrow">PUZZLE COMPLETED</div><h2>Well done!</h2><div class="grade" id="grade">A</div><div class="score" id="score">Score: 0</div><div class="result-stats"><div class="result-stat"><small>TIME</small><strong id="rtime">00:00</strong></div><div class="result-stat"><small>MOVES</small><strong id="rmoves">0</strong></div></div><div class="result-actions"><button class="btn primary" id="again">Play again</button><button class="btn" id="rhome">Main menu</button></div></div></div>
<script>
(function(){
const root=document.getElementById('puzzle15-game');if(!root||root.dataset.ready==='1')return;root.dataset.ready='1';
const $=s=>root.querySelector(s),menu=$('#menu'),play=$('#play'),boardEl=$('#board'),overlay=$('#overlay');
let size=4,tiles=[],moves=0,seconds=0,timer=null,started=false,finished=false;
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function bestKey(n){return 'p15-best-'+n}function getBest(n){try{return JSON.parse(localStorage.getItem(bestKey(n))||'null')}catch(e){return null}}
function putBest(n,v){try{localStorage.setItem(bestKey(n),JSON.stringify(v))}catch(e){}}
function renderBest(){[4,5,6].forEach(n=>{let b=getBest(n),e=$('#best'+n);e.innerHTML=b?'BEST<br><strong>'+b.score.toLocaleString()+'</strong> pts · GRADE <strong>'+b.grade+'</strong><br><span>'+b.time+' / '+b.moves+' moves</span>':'BEST<br><strong>—</strong> pts · GRADE <strong>—</strong>'})}
function solved(a){for(let i=0;i<a.length-1;i++)if(a[i]!==i+1)return false;return a[a.length-1]===0}
function near(a,b){return Math.abs(Math.floor(a/size)-Math.floor(b/size))+Math.abs(a%size-b%size)===1}
function shuffle(){let a=Array.from({length:size*size},(_,i)=>i===size*size-1?0:i+1),blank=a.length-1,prev=-1;for(let k=0;k<size*size*size*18;k++){let opts=[];for(let i=0;i<a.length;i++)if(a[i]&&near(i,blank)&&i!==prev)opts.push(i);if(!opts.length)for(let i=0;i<a.length;i++)if(a[i]&&near(i,blank))opts.push(i);let p=opts[Math.floor(Math.random()*opts.length)];[a[blank],a[p]]=[a[p],a[blank]];prev=blank;blank=p}return solved(a)?shuffle():a}
function render(){boardEl.style.gridTemplateColumns='repeat('+size+',minmax(0,1fr))';boardEl.innerHTML='';tiles.forEach((v,i)=>{let b=document.createElement('button');b.type='button';b.className='tile'+(!v?' empty':'');b.textContent=v||'';b.setAttribute('aria-label',v?'Tile '+v:'Empty space');b.disabled=!v||finished;b.addEventListener('click',()=>move(i));boardEl.appendChild(b)})}
function stats(){$('#moves').textContent=moves;$('#time').textContent=fmt(seconds)}
function stop(){if(timer!==null){clearInterval(timer);timer=null}}
function startClock(){if(timer!==null||finished)return;timer=setInterval(()=>{if(started&&!finished){seconds++;$('#time').textContent=fmt(seconds)}},1000)}
function begin(n){size=n;moves=0;seconds=0;started=false;finished=false;stop();tiles=shuffle();menu.classList.add('hide');play.classList.remove('hide');overlay.classList.add('hide');$('#sizeLabel').textContent=size+' × '+size;stats();render()}
function move(i){if(finished||!tiles[i])return;let z=tiles.indexOf(0);if(!near(i,z))return;if(!started){started=true;startClock()}[tiles[i],tiles[z]]=[tiles[z],tiles[i]];moves++;stats();render();if(solved(tiles))complete()}
function scoring(){let optimal=size*size-1,budget=size===4?120:size===5?300:600,mr=optimal/Math.max(optimal,moves),tr=budget/(budget+seconds),score=Math.max(0,Math.round(1000*(.65*mr+.35*tr))),grade=score>=950?'S':score>=850?'A':score>=700?'B':score>=500?'C':score>=300?'D':'E';return{score,grade}}
function complete(){finished=true;stop();render();let r=scoring();$('#grade').textContent=r.grade;$('#score').textContent='Score: '+r.score.toLocaleString();$('#rtime').textContent=fmt(seconds);$('#rmoves').textContent=moves;let b=getBest(size);if(!b||r.score>b.score){putBest(size,{score:r.score,grade:r.grade,time:fmt(seconds),moves});renderBest()}overlay.classList.remove('hide')}
function showMenu(){stop();overlay.classList.add('hide');play.classList.add('hide');menu.classList.remove('hide');renderBest()}
root.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>begin(+b.dataset.size)));
$('#restart').addEventListener('click',()=>begin(size));$('#home').addEventListener('click',showMenu);$('#close').addEventListener('click',()=>overlay.classList.add('hide'));$('#again').addEventListener('click',()=>begin(size));$('#rhome').addEventListener('click',showMenu);renderBest();
})();
</script></div>
